<body>

<!--   HEADER  -->

        <div class="capaHero">
            <nav>

<!-- CONTENIDO -->
<section class="containerPresupuesto">

    <h1>Solicita tu retrato personalizado</h1>
  
    <form id="formPresupuesto" novalidate>
  
        <!-- ================= DATOS DE CONTACTO ================= -->

        <div class="datosContacto">
             <h2>Datos de contacto</h2>
  
             <!-- Nombre -->
             <div class="campo">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required pattern="[A-Za-z]{1,15}" maxlength="15" placeholder="Ej: Juan" title="Solo letras, máximo 15 caracteres">
             </div>   
  
             <!-- Apellidos -->
             <div class="campo"> 
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" required pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]{1,15}" maxlength="40" placeholder="Ej: Pérez García" title="Solo letras, máximo 40 caracteres">
             </div>    
  
             <!-- Teléfono -->   
             <div class="campo"> 
                 <label for="telefono">Teléfono:</label>
                 <input type="tel" id="telefono" required pattern="[0-9]{9}" maxlength="9" placeholder="Ej: 600123456" title="Debe tener 9 números">
             </div>   

       
             <!-- Email -->
             <div class="campo"> 
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="Ej: correo@email.com" title="Introduce un email válido">
             </div>  
         </div>    
  
        <!-- ================= CONFIGURACIÓN ================= -->
         <div class="configuracion">
            <h2>Configuración del retrato</h2>
  
            <!-- Técnica -->
            <div class="campo">
                <div class="tecnica">
                    <label for="tecnica">Técnica:</label>
                    <select id="tecnica">
                        <option value="lapiz">Lápiz</option>
                        <option value="acuarela">Acuarela</option>
                        <option value="oleo">Óleo</option>
                    </select>
               </div>    
                <!-- Tamaño -->
                <div class="tamano">
                    <label for="tamano">Tamaño:</label>
                    <select id="tamano">
                        <option value="pequeno">Pequeño</option>
                        <option value="mediano">Mediano</option>
                        <option value="grande">Grande</option>
                    </select>
                </div>    
             
            <!-- Enmarcado -->
                <label class="check">
                    <input type="checkbox" id="enmarcado"> Añadir enmarcado (+ <span id="precioMarco">20</span> €)
                </label>
            </div>    
            <!-- Extras -->
            <h3>Extras</h3>
  
            <div class="campo">
                <label class="check">
                    <input type="checkbox" class="extra" value="15"> Fondo personalizado (+15€)
                </label>
  
                <label class="check">
                     <input type="checkbox" class="extra" value="20">Segunda persona (+20€)
                </label>
            </div>
  
            <!-- Plazo -->
             <div class="campo">
                <label for="plazo">Días de entrega:</label>
                <input class="plazo" type="number" id="plazo" min="1" value="15" required>
            </div>
            <!-- Resultado -->
            <h2 id="resultado">Precio: 0 €</h2>
  
            <!-- Condiciones -->
                <label class="check">
                    <input type="checkbox" id="condiciones" required> Acepto las condiciones de privacidad
                </label>
            <!-- Botones -->
            <div class="botones">
                <button type="submit">Enviar</button>
                <button type="reset">Resetear</button>
            </div>
  
         </div>
  
    </form>
  
  </section>

 </footer>
